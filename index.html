<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xjnl viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗒️</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css">
<style>
  :root {
    --bg: #f6f5f3; --panel: #fff; --sunk: #f1efec; --fg: #1c1917; --dim: #78716c; --faint: #a8a29e; --line: #e4e1dd;
    --task: #0f766e; --flow: #7c3aed; --note: #b45309; --py: #2563eb; --expr: #9333ea; --hit: #fde68a; --bad: #dc2626;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312; --panel: #1d1c1a; --sunk: #191817; --fg: #e7e5e4; --dim: #a8a29e; --faint: #6b6560; --line: #312e2b;
      --task: #2dd4bf; --flow: #a78bfa; --note: #f59e0b; --py: #60a5fa; --expr: #c084fc; --hit: #713f12; --bad: #f87171;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: grid; grid-template: auto 1fr / auto 1fr; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--task); border-color: var(--task); color: var(--panel); font-weight: 600; }
  .mono, textarea.v, .CodeMirror { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  /* top bar: file on the left, search on the right */
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; margin-right: 6px; }
  .file { display: flex; flex-direction: column; min-width: 0; margin: 0 8px; }
  #fname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  #state { font-size: 11px; color: var(--dim); }
  body.dirty #state { color: var(--note); }
  .grow { flex: 1; }
  #q { width: 220px; }
  header input { background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; }
  #replaceBar { display: none; gap: 6px; align-items: center; flex-basis: 100%; justify-content: flex-end; }
  body.replacing #replaceBar { display: flex; }

  aside { display: none; width: 270px; overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px 0; }
  body.folder aside { display: block; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 4px 14px 8px; }
  aside button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 3px 14px 3px 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside button.dir { color: var(--dim); font-size: 11px; font-weight: 600; padding-left: 14px; margin-top: 8px; cursor: default; }
  aside button.cur { background: var(--sunk); box-shadow: inset 3px 0 var(--task); font-weight: 600; }

  main { grid-column: 2; overflow: auto; padding: 0 24px 40vh; min-width: 0; }
  #save, #revert { display: none; }
  body.loaded #save, body.loaded #revert { display: inline-block; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .bar .count { color: var(--dim); margin-left: 8px; }
  .welcome { max-width: 520px; margin: 12vh auto; text-align: center; color: var(--dim); }
  .welcome h1 { color: var(--fg); font-size: 22px; margin-bottom: 4px; }
  .welcome .btns { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* journal blocks */
  .blk { position: relative; margin: 6px 0; }
  .bh { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; }
  .collapsible > .bh { cursor: pointer; }
  .chev { border: 0; background: none; padding: 0; width: 16px; color: var(--dim); }
  .chev::before { content: '▾'; }
  .shut > .bh .chev::before { content: '▸'; }
  .shut > .bb { display: none; }
  .kw { font-family: ui-monospace, Consolas, monospace; font-weight: 700; }
  .dim { color: var(--dim); }
  .chip { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
  .chip.off { color: var(--bad); border-color: var(--bad); }
  .off > .bh, .off > .bb, .off > textarea { opacity: .45; }
  .miss { opacity: .3; }
  .acts { margin-left: auto; display: flex; gap: 2px; opacity: .25; }
  .blk:hover > .bh > .acts, .note:hover > .acts { opacity: 1; }
  .acts button { border: 0; background: none; padding: 0 5px; color: var(--dim); }
  .acts button:hover { color: var(--fg); }

  textarea, .bh input, .mid input { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; field-sizing: content; resize: none; }
  textarea:hover, .bh input:hover, .mid input:hover { border-color: var(--line); }
  textarea:focus, .bh input:focus, .mid input:focus { outline: none; border-color: var(--dim); background: var(--panel); }
  .bh input, .mid input { min-width: 3ch; max-width: 70ch; font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--sunk); }

  .note { padding-left: 12px; border-left: 3px solid var(--note); }
  .note.xml { border-left-style: dashed; border-left-color: var(--faint); }
  .note textarea { width: 100%; color: var(--dim); font-style: italic; min-height: 1.6em; }
  .note > .acts { position: absolute; right: 0; top: 0; }

  .flow > .bh .kw { color: var(--flow); }
  .flow > .bb { margin-left: 7px; padding-left: 14px; border-left: 2px solid color-mix(in srgb, var(--flow) 40%, transparent); }
  .stmt > .bh .kw { color: var(--flow); }
  .stmt textarea { flex: 1; min-width: 20ch; font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--sunk); }

  .task { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--task); border-radius: 6px; padding: 4px 10px; }
  .task > .bh .tid { font-weight: 700; color: var(--task); font-family: ui-monospace, Consolas, monospace; }
  .task > .bh .sum { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 0; min-width: 0; }
  .task > .bb { padding: 6px 0 4px; border-top: 1px solid var(--line); margin-top: 4px; }
  .py { border-left: 3px solid var(--py); padding-left: 10px; }
  .py > .bh .kw { color: var(--py); }
  .py .first { color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .info > .bh .kw { color: var(--dim); }

  /* parameter tree */
  .pg { margin: 0; }
  .pg > .bh { min-height: 22px; }
  .pg > .bb { margin-left: 7px; padding-left: 14px; border-left: 1px solid var(--line); }
  .pk { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); }
  .pg > .bh .pk { color: var(--fg); font-weight: 600; }
  /* one grid for every row: key | value | auto. The key column shrinks by one indent
     (22px) per level, so values line up at the same x at any depth */
  :root { --key: 280px; }
  .prow { display: grid; grid-template-columns: calc(var(--key) - var(--d, 0) * 22px) minmax(0, 1fr) 52px; gap: 8px; align-items: center; padding: 1px 0 1px 22px; }
  .prow > .pk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg > .bh { display: grid; grid-template-columns: 16px calc(var(--key) - var(--d, 0) * 22px + 6px - 16px - 8px) minmax(0, 1fr) 52px; gap: 8px; }
  .prow:hover { background: var(--sunk); }
  textarea.v { width: 100%; min-width: 0; background: var(--sunk); border-color: var(--line); padding: 1px 6px; }
  textarea.v:placeholder-shown { border-style: dashed; }
  .sub { font-size: 11px; color: var(--faint); margin-right: 3px; }
  .mid { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .mid > textarea, .mid > .fields { flex: 1; min-width: 0; }
  .fields { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
  /* compound fields carry their label inside the box, so each box starts on the column */
  .field { display: flex; align-items: center; min-width: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding-left: 6px; }
  .field .sub { flex: none; margin-right: 2px; }
  .field textarea.v { border: 0; background: transparent; }
  .stmt .bh > input:first-of-type { width: 24ch; }
  .auto { font-size: 11px; color: var(--faint); display: inline-flex; gap: 3px; align-items: center; }
  .expr { color: var(--expr); }
  .hit, .hit textarea.v { background: var(--hit) !important; }

  /* scrollbars: thin, rounded, themed (Firefox gets the standard properties) */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--faint); }
  ::-webkit-scrollbar-corner { background: transparent; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; } }

  .CodeMirror { height: auto; border: 1px solid var(--line); border-radius: 4px; margin: 4px 0; }
  .pyerr { background: color-mix(in srgb, var(--bad) 25%, transparent); }
  .pyres.bad { color: var(--bad); }
  @media (max-width: 760px) {
    body { grid-template: auto auto 1fr / 1fr; }
    aside { width: auto; max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { grid-column: 1; padding: 0 12px 40vh; }
    #q { width: 100%; }
    :root { --key: 130px; }
    .fields { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <span class="brand">🗒️ xjnl</span>
  <button id="openDir" title="Abrir uma pasta de journals (Edge/Chrome)">Abrir pasta</button>
  <button id="openFile">Abrir arquivo</button>
  <div class="file"><span id="fname"></span><span id="state"></span></div>
  <button id="save" class="primary" title="Ctrl+S">Salvar</button>
  <button id="revert" title="Volta ao conteúdo do disco">Descartar</button>
  <span class="grow"></span>
  <input id="q" type="search" placeholder="Buscar (Ctrl+F)">
  <button id="toggleReplace" title="Substituir em todo o journal">Substituir…</button>
  <div id="replaceBar"><input id="r" placeholder="substituir por"><button id="replace">Substituir tudo</button></div>
</header>
<aside><h2 id="ftitle">Journals</h2><div id="files"></div></aside>
<main id="journal">
  <div class="welcome">
    <h1>xjnl viewer</h1>
    <p>Veja e edite batches do Isatis.neo sem licença. Os arquivos são lidos e gravados pelo navegador; nada sai da sua máquina.</p>
    <div class="btns"><button class="primary" onclick="$('openDir').click()">Abrir pasta de batches</button><button onclick="$('openFile').click()">Abrir um .xjnl</button><button id="example">Ver exemplo</button></div>
    <div class="legend"><span><i style="background:var(--task)"></i>task</span><span><i style="background:var(--flow)"></i>foreach / for / if</span><span><i style="background:var(--note)"></i>comentário</span><span><i style="background:var(--py)"></i>python</span></div>
  </div>
</main>
<input type="file" id="picker" accept=".xjnl" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="xjnl.js"></script>
<script>
const $ = id => document.getElementById(id);
const fsApi = 'showDirectoryPicker' in window;
let files = [], cur = null; // cur: { path, handle, src, doc, dirty }

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : k in e ? e[k] = v : e.setAttribute(k, v);
  e.append(...kids.flat(Infinity).filter(k => k != null && k !== false));
  return e;
}
const state = s => $('state').textContent = s;
function setDirty(d) { document.body.classList.toggle('dirty', d); if (cur) cur.dirty = d; state(d ? '● alterações não salvas' : cur ? 'sem alterações' : ''); }
const changed = () => setDirty(true);
const query = () => $('q').value.trim().toLowerCase();
const has = (s, q) => s.toLowerCase().includes(q);

// ---- files --------------------------------------------------------------
async function walk(dir, prefix = '') {
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'directory') await walk(handle, prefix + name + '/');
    else if (name.toLowerCase().endsWith('.xjnl')) files.push({ path: prefix + name, handle });
  }
}

function renderFiles() {
  let lastDir = null;
  $('files').replaceChildren(...files.flatMap(f => {
    const i = f.path.lastIndexOf('/'), dir = f.path.slice(0, i + 1), out = [];
    if (dir !== lastDir) { lastDir = dir; if (dir) out.push(h('button', { className: 'dir', textContent: dir, tabIndex: -1 })); }
    out.push(h('button', { textContent: f.path.slice(i + 1), title: f.path, className: cur && cur.path === f.path ? 'cur' : '', onclick: () => load(f) }));
    return out;
  }));
}

const discard = () => !(cur && cur.dirty) || confirm(`Descartar as alterações em ${cur.path}?`);

async function load(f, file) {
  if (!discard()) return;
  const src = await (file || await f.handle.getFile()).text();
  cur = { ...f, src };
  document.body.classList.add('loaded');
  $('fname').textContent = f.path.split('/').pop();
  $('fname').title = f.path;
  document.title = f.path.split('/').pop() + ' · xjnl';
  renderFiles();
  reparse();
}

function reparse() {
  try { cur.doc = XJNL.parse(cur.src); setDirty(false); render(); }
  catch (e) { cur.doc = null; setDirty(false); $('journal').replaceChildren(h('p', { className: 'welcome', textContent: 'Não foi possível ler o journal: ' + e.message })); }
}

async function save() {
  if (!cur || !cur.doc) return;
  const out = XJNL.serialize(cur.doc);
  if (cur.handle && cur.handle.createWritable) {
    const w = await cur.handle.createWritable(); await w.write(out); await w.close();
  } else {
    h('a', { href: URL.createObjectURL(new Blob([out], { type: 'application/xml' })), download: cur.path.split('/').pop() }).click();
  }
  cur.src = out; setDirty(false); state('salvo ' + new Date().toLocaleTimeString());
}

$('openDir').onclick = async () => {
  if (!fsApi) return alert('Abrir pasta exige Edge ou Chrome. Use "Abrir arquivo".');
  if (!discard()) return;
  const dir = await window.showDirectoryPicker({ mode: 'readwrite' }).catch(() => null);
  if (!dir) return;
  files = [];
  await walk(dir);
  files.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
  document.body.classList.add('folder');
  $('ftitle').textContent = `${dir.name} · ${files.length} journals`;
  renderFiles();
};
$('openFile').onclick = async () => {
  if (!('showOpenFilePicker' in window)) return $('picker').click();
  const [handle] = await window.showOpenFilePicker({ types: [{ description: 'Isatis journal', accept: { 'application/xml': ['.xjnl'] } }] }).catch(() => []);
  if (handle) load({ path: handle.name, handle });
};
$('picker').onchange = e => { const file = e.target.files[0]; if (file) load({ path: file.name }, file); e.target.value = ''; };
$('example').onclick = async () => {
  const path = 'exemplo/estimativa.xjnl';
  load({ path }, new File([await (await fetch(path)).text()], 'estimativa.xjnl'));
};
$('save').onclick = save;
$('revert').onclick = () => cur && cur.dirty && confirm('Descartar todas as alterações?') && reparse();
$('toggleReplace').onclick = () => { document.body.classList.toggle('replacing'); $('r').focus(); };
addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'f' && cur) { e.preventDefault(); $('q').focus(); $('q').select(); }
});
addEventListener('beforeunload', e => { if (cur && cur.dirty) e.preventDefault(); });

// ---- journal ------------------------------------------------------------
function render() {
  if (!cur || !cur.doc) return;
  const root = XJNL.elements(cur.doc)[0], all = [];
  (function count(n) { for (const c of XJNL.elements(n)) { if (c.name !== 'param') { all.push(c.name); count(c); } } })(root);
  const n = name => all.filter(x => x === name).length;
  const loops = n('foreach') + n('for'), conds = n('if');
  const bar = h('div', { className: 'bar' },
    h('button', { textContent: 'Expandir tudo', onclick: () => openAll(true) }),
    h('button', { textContent: 'Recolher tudo', onclick: () => openAll(false) }),
    h('span', { className: 'count', textContent: [`${n('task')} task${n('task') === 1 ? '' : 's'}`, loops && `${loops} loops`, conds && `${conds} if`, n('python') && `${n('python')} python`].filter(Boolean).join(' · ') }));
  $('journal').replaceChildren(bar, ...XJNL.blocks(root).map(c => block(c, root)));
}

// expanding opens everything down to the parameter groups; collapsing folds the
// journal blocks and leaves each task's tree as it was
function openAll(v) {
  (function walk(n) { if (n.type === 'el' && (v || n.name !== 'param')) n._open = v; XJNL.elements(n).forEach(walk); })(cur.doc);
  render();
}

function actions(n, parent) {
  const act = (label, title, fn) => h('button', { textContent: label, title, onclick: e => { e.stopPropagation(); fn(); changed(); render(); } });
  return h('span', { className: 'acts' },
    n.type === 'el' && act('⏻', 'Ativar/desativar no Isatis (disabled="block")', () => XJNL.setAttr(n, 'disabled', XJNL.attr(n, 'disabled') ? null : 'block')),
    act('↑', 'Mover para cima', () => XJNL.move(parent, n, -1)),
    act('↓', 'Mover para baixo', () => XJNL.move(parent, n, 1)),
    act('⧉', 'Duplicar', () => XJNL.duplicate(parent, n)),
    act('✕', 'Apagar', () => XJNL.remove(parent, n)));
}

const off = n => n.type === 'el' && XJNL.attr(n, 'disabled');
const offChip = n => off(n) && h('span', { className: 'chip off', textContent: 'desativado' });
const kw = t => h('span', { className: 'kw', textContent: t });
const exprMark = el => { el.classList.toggle('expr', el.value.includes('$(')); return el; };

// a block with a header that folds its body; the body is built on first open
function collapsible(n, cls, head, body, def, force) {
  const box = h('div', { className: `blk collapsible ${cls}` + (off(n) ? ' off' : '') });
  const bd = h('div', { className: 'bb' });
  let built = false;
  const set = (v, keep = true) => { if (keep) n._open = v; box.classList.toggle('shut', !v); if (v && !built) { built = true; bd.append(...[body()].flat(Infinity).filter(Boolean)); } };
  const hd = h('div', { className: 'bh', onclick: e => { if (!e.target.closest('input, textarea, .acts, label')) set(box.classList.contains('shut')); } }, h('button', { className: 'chev', title: 'Expandir/recolher' }), head);
  box.append(hd, bd);
  set(force || (n._open ?? def), !force); // a search opens blocks without changing what you opened
  return box;
}

function attrInput(n, name) {
  if (!XJNL.attr(n, name)) return null;
  return exprMark(h('input', { value: XJNL.attr(n, name).value, title: name, spellcheck: false, oninput: e => { XJNL.setAttr(n, name, e.target.value); exprMark(e.target); changed(); } }));
}
const otherAttrs = (n, skip) => n.attrs.filter(a => !skip.includes(a.name) && a.name !== 'disabled').map(a => [h('span', { className: 'dim', textContent: a.name }), attrInput(n, a.name)]);

function textBox(get, set, cls = '') {
  const q = query();
  return exprMark(h('textarea', { className: cls + (q && has(get(), q) ? ' hit' : ''), value: get(), rows: 1, spellcheck: false, oninput: e => { set(e.target.value); exprMark(e.target); changed(); } }));
}

function block(n, parent) {
  if (n.type === 'comment') return note(n, parent, true);
  if (n.name === 'comment') return note(n, parent, false);
  if (n.name === 'task') return task(n, parent);
  if (n.name === 'python') return python(n, parent);
  if (n.name === 'info') return info(n);
  return XJNL.elements(n).length ? flow(n, parent) : stmt(n, parent);
}

function note(n, parent, xml) {
  const t = xml ? textBox(() => XJNL.value(n), v => XJNL.setValue(n, v.replace(/\r?\n/g, cur.doc.eol)))
                : textBox(() => XJNL.text(n), v => XJNL.setText(n, v, cur.doc.eol));
  t.title = xml ? 'Nota XML (<!-- -->): não aparece no Isatis' : 'Comentário do batch';
  return h('div', { className: 'blk note' + (xml ? ' xml' : '') + (off(n) ? ' off' : '') }, t, actions(n, parent));
}

function flow(n, parent) {
  const a = name => attrInput(n, name);
  const head = {
    foreach: () => [kw('foreach'), a('element'), XJNL.attr(n, 'element') && kw('in'), a('array'), otherAttrs(n, ['element', 'array'])],
    for: () => [kw('for'), a('index'), kw('='), a('start'), kw('…'), a('end'), otherAttrs(n, ['index', 'start', 'end'])],
    if: () => [kw('if'), a('condition'), otherAttrs(n, ['condition'])],
    elseif: () => [kw('elseif'), a('condition'), otherAttrs(n, ['condition'])],
  }[n.name] || (() => [kw(n.name), otherAttrs(n, [])]);
  return collapsible(n, 'flow', [head(), offChip(n), actions(n, parent)], () => XJNL.blocks(n).map(c => block(c, n)), true);
}

function stmt(n, parent) {
  const text = XJNL.text(n), box = textBox(() => XJNL.text(n), v => XJNL.setText(n, v, cur.doc.eol));
  const parts = {
    array: () => [kw('array'), attrInput(n, 'name'), kw('='), box],
    variable: () => [kw('variable'), attrInput(n, 'name'), kw('='), box, otherAttrs(n, ['name'])],
    include: () => [kw('include'), attrInput(n, 'file'), otherAttrs(n, ['file'])],
    redirect: () => [kw('redirect'), attrInput(n, 'mode'), kw('→'), box],
  }[n.name] || (() => [kw(n.name), otherAttrs(n, []), (text !== '' || !n.attrs.length) && box]);
  return h('div', { className: 'blk stmt' + (off(n) ? ' off' : '') }, h('div', { className: 'bh' }, parts(), offChip(n), actions(n, parent)));
}

function info(n) {
  const v = name => XJNL.elements(n).find(c => c.name === name);
  const line = ['application', 'date'].map(v).filter(Boolean).map(c => XJNL.text(c)).join(' · ');
  return collapsible(n, 'info', [kw('info'), h('span', { className: 'dim', textContent: line })], () => params(n, '', 0), false);
}

// ---- tasks: the parameter tree ------------------------------------------
const label = e => XJNL.attr(e, 'key')?.value ?? e.name;
const leaf = e => !XJNL.elements(e).length;
const hits = (e, q) => has(label(e), q) || e.attrs.some(a => has(a.value, q)) || (leaf(e) ? has(XJNL.text(e), q) : XJNL.elements(e).some(c => hits(c, q)));

function value(e) {
  const t = textBox(() => XJNL.text(e), v => XJNL.setText(e, v, cur.doc.eol), 'v');
  t.placeholder = ' ';
  return t;
}

// param attributes: automatic="yes|no" as a checkbox, a param-level loop as "↻ foreach v in arr", anything else as name + input
// split in two: loop/other attributes go in the value column, the auto checkbox in its own
function extras(e) {
  const out = [];
  const auto = XJNL.attr(e, 'automatic');
  if (XJNL.attr(e, 'repeat')) out.push(h('span', { className: 'chip' }, '↻ ', XJNL.attr(e, 'repeat').value, ' ', attrInput(e, 'element'), ' in ', attrInput(e, 'array')));
  out.push(otherAttrs(e, ['key', 'automatic', 'repeat', 'element', 'array']));
  return [out.flat(), auto && h('label', { className: 'auto', title: 'automatic="yes": o Isatis calcula este valor' },
    h('input', { type: 'checkbox', checked: auto.value === 'yes', onchange: ev => { XJNL.setAttr(e, 'automatic', ev.target.checked ? 'yes' : 'no'); changed(); } }), 'auto')];
}

function params(parent, q, d) {
  return XJNL.elements(parent).filter(e => !q || hits(e, q)).map(e => param(e, q, d));
}

function param(e, q, d) {
  const kids = XJNL.elements(e), key = h('span', { className: 'pk', textContent: label(e) });
  key.title = label(e);
  const [mid, auto] = extras(e);
  const row = v => h('div', { className: 'prow', style: '--d:' + d }, key, mid.length ? h('div', { className: 'mid' }, mid, v) : v, h('span', {}, auto));
  if (!kids.length) return row(value(e));
  // a node whose children are plain fields (ROOT: path/file/table, VARIABLE: ...) reads best on one line
  if (kids.length === 1 && leaf(kids[0]) && kids[0].name !== 'param') {
    key.textContent = label(e) + ' › ' + kids[0].name;
    key.title = key.textContent;
    return row(value(kids[0]));
  }
  if (kids.every(c => leaf(c) && c.name !== 'param'))
    return row(h('div', { className: 'fields', style: '--n:' + kids.length }, kids.map(c => h('span', { className: 'field' }, h('span', { className: 'sub', textContent: c.name }), value(c)))));
  const g = collapsible(e, 'pg', [key, h('span', { className: 'mid' }, mid), h('span', {}, auto)], () => params(e, q, d + 1), true, !!q);
  g.style.setProperty('--d', d);
  return g;
}

function task(n, parent) {
  const q = query();
  const vals = [];
  (function walk(e) { for (const c of XJNL.elements(e)) leaf(c) ? XJNL.text(c) && vals.push(XJNL.text(c)) : walk(c); })(n);
  const sum = [...new Set(vals)].slice(0, 3).join(' · ');
  const hit = !q || has(XJNL.attr(n, 'id')?.value || '', q) || XJNL.elements(n).some(e => hits(e, q));
  const box = collapsible(n, 'task' + (hit ? '' : ' miss'),
    [h('span', { className: 'tid', textContent: XJNL.attr(n, 'id')?.value ?? 'task' }),
     XJNL.attr(n, 'version') && h('span', { className: 'chip', textContent: 'v' + XJNL.attr(n, 'version').value }),
     offChip(n), h('span', { className: 'sum', textContent: sum, title: sum }), actions(n, parent)],
    () => params(n, hit && q && !has(XJNL.attr(n, 'id')?.value || '', q) ? q : '', 0), false, !!q && hit);
  return box;
}

// ---- python: CodeMirror (built on first open, a plain textarea if the CDN is unreachable)
// and a syntax check with Pyodide on the Python Isatis embeds (3.11), loaded on first use
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/';
const EXPR = /\$\((?:[^()]|\([^()]*\))*\)/g; // batch $(...) substitutions -> a plain name
const CHECK = `
def _chk(s):
    try:
        compile(s, '<python>', 'exec')
        return ''
    except SyntaxError as e:
        return f'{e.lineno or 0}\\t{e.msg}'
_chk(src)`;
let pyodide = null;
function pyCheck(code) {
  pyodide ??= new Promise((ok, fail) => document.head.append(h('script', { src: PYODIDE + 'pyodide.js', onerror: fail,
    onload: () => loadPyodide({ indexURL: PYODIDE }).then(ok, fail) }))).catch(e => { pyodide = null; throw e; });
  return pyodide.then(p => { p.globals.set('src', code.replace(EXPR, '_')); return p.runPython(CHECK); });
}

function python(n, parent) {
  const q = query(), code = XJNL.text(n);
  const first = code.split('\n').map(s => s.trim()).find(Boolean) || '';
  return collapsible(n, 'py', [kw('python'), h('span', { className: 'first', textContent: first }), offChip(n), actions(n, parent)], () => {
    const box = h('div'), res = h('span', { className: 'pyres dim' });
    let cm = null, bad = null;
    const mark = line => { if (!cm) return; if (bad != null) cm.removeLineClass(bad, 'background', 'pyerr'); bad = line; if (line != null) cm.addLineClass(line, 'background', 'pyerr'); };
    if (window.CodeMirror) {
      cm = CodeMirror(box, { value: XJNL.text(n).replace(/\r\n/g, '\n'), mode: 'python', lineNumbers: true, indentUnit: 4, viewportMargin: Infinity,
        theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'material-darker' : 'default' });
      cm.on('change', () => { XJNL.setText(n, cm.getValue(), cur.doc.eol); changed(); mark(null); res.textContent = ''; });
      requestAnimationFrame(() => cm.refresh());
    } else box.append(textBox(() => XJNL.text(n), v => XJNL.setText(n, v, cur.doc.eol), 'v'));
    const validate = async () => {
      res.className = 'pyres dim';
      res.textContent = pyodide ? 'validando…' : 'carregando Python 3.11 (~10 MB na primeira vez)…';
      try {
        const out = await pyCheck(cm ? cm.getValue() : XJNL.text(n));
        if (!out) { res.textContent = '✓ sintaxe OK (Python 3.11)'; mark(null); return; }
        const [line, msg] = out.split('\t');
        res.className = 'pyres bad';
        res.textContent = `✗ linha ${line}: ${msg}`;
        if (cm && +line > 0) { mark(+line - 1); cm.scrollIntoView({ line: +line - 1, ch: 0 }); }
      } catch (e) { res.textContent = 'não foi possível carregar o Pyodide: ' + e.message; }
    };
    return [box, h('div', { className: 'bh' }, h('button', { textContent: 'Validar sintaxe', onclick: validate }), res)];
  }, false, !!q && has(code, q));
}

$('q').oninput = render;
$('replace').onclick = () => {
  const q = $('q').value; if (!cur || !cur.doc || !q) return;
  const count = XJNL.replaceAll(cur.doc, new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), $('r').value, cur.doc.eol);
  if (count) changed();
  state(`${count} substituições` + (count ? ' · não salvo' : ''));
  render();
};
</script>
</body>
</html>
